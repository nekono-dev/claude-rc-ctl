# 責務: インストーラ（ブートストラップ install.sh）の検査と頒布。ブランチ・タグへのpush、および手動実行ごとに、そのコミットに固定した install.sh を生成する。
#   - 検査: シェルの構文・shellcheck（installer/*.sh）、{{PRECHECK_STEPS_SUMMARY}}
#   - ブランチ: 生成した install.sh・install.sh.sha256 を、ワークフローのartifact（installer-<ブランチ名>）として保存する。
#              タグ・Pre-releaseは作らない（ブランチの導入・切り替えは、Releaseのinstall.shを使い --ref <ブランチ名> で指定する）
#   - タグ（v*）: GitHub Releaseへ install.sh・install.sh.sha256 を添付する
#       最新:   https://github.com/<owner>/<repo>/releases/latest/download/install.sh
#       版固定: https://github.com/<owner>/<repo>/releases/download/<タグ>/install.sh
#   - 手動実行（workflow_dispatch）: 対象ブランチ/タグを選んで再実行すると、上記と同じ処理を再度走らせる
name: release-installer

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.names.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4

      - name: シェルの検査（構文・shellcheck）
        run: |
          for f in installer/*.sh; do sh -n "$f"; done
          shellcheck -S warning installer/*.sh

      {{PRECHECK_STEPS}}

      - name: インストーラ（ブートストラップ）を生成
        env:
          REF: ${{ github.ref }}
          COMMIT: ${{ github.sha }}
          REPO_URL: https://github.com/${{ github.repository }}.git
        run: |
          mkdir -p {{DIST_DIR}}
          sh installer/build-bootstrap.sh "$REF" "$COMMIT" "$REPO_URL" > {{DIST_DIR}}/install.sh
          sh -n {{DIST_DIR}}/install.sh
          (cd {{DIST_DIR}} && sha256sum install.sh > install.sh.sha256)
          cat {{DIST_DIR}}/install.sh.sha256

      - name: 名前の算出（ブランチ・タグ名の/を-にする）
        id: names
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          slug=$(printf '%s' "$REF_NAME" | tr '/' '-')
          echo "artifact=installer-$slug" >> "$GITHUB_OUTPUT"

      - name: 導入・切り替えのコマンドをサマリへ出力
        env:
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "### $REF_NAME の導入・切り替え"
            echo
            echo '```sh'
            echo "curl -fsSL https://github.com/$REPO/releases/latest/download/install.sh | sh -s -- install --ref $REF_NAME"
            echo "<アプリ名>-ctl update --ref $REF_NAME"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.artifact }}
          path: {{DIST_DIR}}/
          if-no-files-found: error

  release-tag:
    # タグ（v*）へのpush・手動実行のときだけ、GitHub Releaseへ添付する。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: {{DIST_DIR}}
          merge-multiple: true

      - name: GitHub Releaseへ添付
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          gh release upload "$TAG" {{DIST_DIR}}/install.sh {{DIST_DIR}}/install.sh.sha256 --repo "$GITHUB_REPOSITORY" --clobber
